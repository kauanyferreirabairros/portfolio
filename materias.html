<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Matérias</title>

  <link href="https://fonts.googleapis.com/css2?family=PT+Serif&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial;
      background: #f0f0f0;
      animation: fadeIn 0.8s ease;
    }

    header {
      background: #4B0000;
      padding: 15px;
      text-align: right;
    }

    header a {
      color: white;
      margin-left: 25px;
      text-decoration: none;
      font-family: 'PT Serif', serif;
      font-weight: bold;
      font-size: 18px;
      transition: 0.3s;
    }

    header a:hover {
      color: #ffb3b3;
    }

    .cards,
    .cards2 {
      display: flex;
      justify-content: center;
      gap: 50px;
      padding: 70px;
      flex-wrap: wrap;
    }

    .card {
      width: 280px;
      text-align: center;
      animation: fadeUp 1s ease both;
    }

    /* ANIMAÇÃO DOS CARDS - PRIMEIRO GRUPO */
    .cards .card:nth-child(1) {
      animation-delay: 0.2s;
    }

    .cards .card:nth-child(2) {
      animation-delay: 0.4s;
    }

    .cards .card:nth-child(3) {
      animation-delay: 0.6s;
    }

    .cards .card:nth-child(4) {
      animation-delay: 0.8s;
    }

    /* ANIMAÇÃO DOS CARDS - CURSO TÉCNICO */
    .cards2 .card:nth-child(1) {
      animation-delay: 1s;
    }

    .cards2 .card:nth-child(2) {
      animation-delay: 1.2s;
    }

    .cards2 .card:nth-child(3) {
      animation-delay: 1.4s;
    }

    .cards2 .card:nth-child(4) {
      animation-delay: 1.6s;
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      transition: 0.4s;
    }

    .card img:hover {
      transform: scale(1.05);
    }

    .card button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #5a0c0c;
      color: white;
      border: none;
      font-family: 'PT Serif', serif;
      cursor: pointer;
      font-size: 16px;
      border-radius: 6px;
      transition: 0.3s;
    }

    .card button:hover {
      transform: scale(1.05);
      background: #7a0f0f;
    }

    .faixa-curso {
      width: 100%;
      background-color: #4B0000;
      text-align: center;
      padding: 20px 0;
      animation: fadeDown 1s ease;
    }

    .faixa-curso h2 {
      color: white;
      font-family: 'PT Serif', serif;
      margin: 0;
    }

    /* ANIMAÇÃO DA PÁGINA */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* ANIMAÇÃO DOS CARDS */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ANIMAÇÃO DA FAIXA */
    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">Início</a>

  <a href="ppe.html">PPE</a>

</div>
